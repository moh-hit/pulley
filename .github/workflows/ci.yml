name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v5
        with:
          path: .build
          key: spm-${{ runner.os }}-xcode15.4-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode15.4-

      - name: swift build (debug)
        run: swift build

      - name: swift build (release)
        run: swift build -c release

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require CHANGELOG.md when Sources/ changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS:   ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          if echo "$LABELS" | grep -q '"skip-changelog"'; then
              echo "skip-changelog label present — bypassing check."
              exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED" | sed 's/^/  /'
          if echo "$CHANGED" | grep -qE '^Sources/'; then
              if ! echo "$CHANGED" | grep -q '^CHANGELOG\.md$'; then
                  echo "::error::Sources/ changed but CHANGELOG.md was not touched."
                  echo "Add an entry under [Unreleased] or apply the 'skip-changelog' label." >&2
                  exit 1
              fi
          fi
          echo "Changelog check OK."
